<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Quản lý sửa chữa</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        :root {
            --bg: #f3f5fa;
            --p: #fff;
            --t: #182238;
            --m: #7c879c;
            --l: #e3e8f0;
            --b: #315efb;
            --s: #edf1ff;
            --r: #c43e50;
            --g: #16865e;
            --o: #b77819;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            color-scheme: light
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme=light]) {
                --bg: #101728;
                --p: #182238;
                --t: #edf2ff;
                --m: #9ba8c1;
                --l: #2a3853;
                --s: #25365e;
                --g: #4fd1a1;
                --o: #e8b04f;
                --r: #ff7b8c;
                color-scheme: dark
            }
        }

        :root[data-theme=dark] {
            --bg: #101728;
            --p: #182238;
            --t: #edf2ff;
            --m: #9ba8c1;
            --l: #2a3853;
            --s: #25365e;
            --g: #4fd1a1;
            --o: #e8b04f;
            --r: #ff7b8c;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--t);
            font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif
        }

        header {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            background: var(--p);
            border-bottom: 1px solid var(--l);
            padding: 10px 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            z-index: 5
        }

        header h1 {
            font-size: 16px;
            margin: 0;
            flex: 1
        }

        nav {
            display: flex;
            overflow-x: auto;
            background: var(--p);
            border-bottom: 1px solid var(--l)
        }

        nav button {
            flex: none;
            border: 0;
            background: 0;
            color: var(--m);
            padding: 11px 14px;
            font: 600 13px inherit;
            border-bottom: 3px solid transparent
        }

        nav button.on {
            color: var(--b);
            border-color: var(--b)
        }

        main {
            padding: 12px;
            max-width: 1000px;
            margin: auto
        }

        .c {
            background: var(--p);
            border: 1px solid var(--l);
            border-radius: 12px;
            padding: 13px;
            margin-bottom: 10px
        }

        .c h2,
        .c h3 {
            margin: 0 0 8px;
            font-size: 15px
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid var(--l);
            background: var(--bg);
            color: var(--t);
            border-radius: 8px;
            padding: 9px;
            font: inherit;
            min-width: 0
        }

        label {
            font-size: 11px;
            color: var(--m);
            font-weight: 600;
            display: block;
            margin: 6px 0 2px
        }

        .btn {
            border: 0;
            background: var(--b);
            color: #fff;
            border-radius: 8px;
            padding: 9px 12px;
            font: 600 13px inherit;
            cursor: pointer
        }

        .btn.a {
            background: var(--s);
            color: var(--b)
        }

        .btn.x {
            background: transparent;
            border: 1px solid var(--l);
            color: var(--t)
        }

        .btn.d {
            background: transparent;
            border: 1px solid var(--r);
            color: var(--r)
        }

        @page {
            margin: 6mm
        }

        .lbs {
            display: flex;
            flex-wrap: wrap;
            gap: 3mm;
            background: #fff;
            padding: 6px;
            border-radius: 8px
        }

        .lb {
            display: flex;
            gap: 4px;
            align-items: center;
            border: 1px dashed #888;
            padding: 2mm;
            color: #000;
            background: #fff;
            font: 10px/1.25 Arial;
            overflow: hidden;
            break-inside: avoid
        }

        .lb b {
            font-size: 13px
        }

        a.btn {
            text-decoration: none
        }

        .bar {
            display: flex;
            align-items: end;
            gap: 6px;
            height: 110px
        }

        .bar div {
            flex: 1;
            background: var(--b);
            border-radius: 4px 4px 0 0;
            min-height: 2px
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center
        }

        .row>* {
            flex: 1 1 140px
        }

        .row>.btn {
            flex: none
        }

        .g2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px
        }

        .mut {
            color: var(--m);
            font-size: 12px
        }

        .pill {
            display: inline-block;
            border-radius: 20px;
            padding: 2px 9px;
            font-size: 11px;
            font-weight: 700;
            background: var(--s);
            color: var(--b)
        }

        .pill.w {
            background: #fff3df;
            color: var(--o)
        }

        .pill.r {
            background: #ffe9ec;
            color: var(--r)
        }

        .pill.k {
            background: #e3f7ee;
            color: var(--g)
        }

        .steps {
            display: flex;
            gap: 4px;
            margin: 8px 0
        }

        .steps i {
            flex: 1;
            height: 6px;
            border-radius: 4px;
            background: var(--l)
        }

        .steps i.on {
            background: var(--b)
        }

        .tk {
            cursor: pointer
        }

        .stat {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 8px;
            margin-bottom: 10px
        }

        .stat b {
            display: block;
            font-size: 20px
        }

        .tbl {
            overflow-x: auto
        }

        table {
            border-collapse: collapse;
            width: 100%
        }

        td,
        th {
            text-align: left;
            padding: 7px 6px;
            border-bottom: 1px solid var(--l);
            font-size: 13px
        }

        th {
            color: var(--m);
            font-size: 11px
        }

        #bg {
            display: none;
            position: fixed;
            inset: 0;
            background: #0009;
            z-index: 20;
            padding: 10px;
            overflow: auto
        }

        #bg.on {
            display: block
        }

        #md {
            background: var(--p);
            border-radius: 12px;
            padding: 14px;
            max-width: 700px;
            margin: auto
        }

        canvas {
            width: 100%;
            height: 120px;
            border: 1px dashed var(--m);
            border-radius: 8px;
            background: #fff;
            touch-action: none
        }

        .ph {
            display: flex;
            gap: 6px;
            flex-wrap: wrap
        }

        .ph img {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 8px
        }

        .pr {
            background: #fff;
            color: #111;
            padding: 14px;
            font-family: Arial
        }

        .pr td,
        .pr th {
            color: #111;
            border-color: #ccc
        }

        #toast {
            position: fixed;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            background: #17233e;
            color: #fff;
            padding: 9px 14px;
            border-radius: 9px;
            opacity: 0;
            transition: .2s;
            z-index: 30;
            pointer-events: none
        }

        #toast.on {
            opacity: 1
        }

        body {
            padding-bottom: 84px
        }

        header {
            background: linear-gradient(135deg, #315efb, #6b4ff0);
            color: #fff;
            border: 0;
            padding: 14px 14px 12px;
            border-radius: 0 0 18px 18px
        }

        header h1 {
            font-size: 18px
        }

        header select,
        header .btn.x {
            background: #ffffff26;
            color: #fff;
            border: 0
        }

        header select option {
            color: #111
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 7;
            justify-content: space-around;
            border-top: 1px solid var(--l);
            border-bottom: 0;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            box-shadow: 0 -4px 16px #0001
        }

        nav button {
            flex: 1;
            padding: 7px 2px 6px;
            font-size: 10px;
            border-bottom: 0;
            border-top: 3px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px
        }

        nav button span {
            font-size: 19px
        }

        nav button.on {
            border-top-color: var(--b);
            background: var(--s)
        }

        .c {
            border-radius: 16px;
            border: 0;
            box-shadow: 0 2px 10px #1a2a5a14
        }

        .tk {
            border-left: 5px solid var(--b)
        }

        .tk:active {
            transform: scale(.99)
        }

        .btn {
            border-radius: 10px;
            padding: 10px 14px
        }

        input,
        select,
        textarea {
            border-radius: 10px;
            padding: 10px;
            font-size: 15px
        }

        .pg {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px
        }

        .pc {
            background: var(--bg);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 2px 10px #1a2a5a14
        }

        .pc img,
        .pc .ni {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            background: var(--s);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px
        }

        .pc>div:last-child {
            padding: 8px
        }

        .stat b {
            font-size: 22px
        }

        body {
            font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background: radial-gradient(1100px 380px at 50% -90px, var(--s), transparent), var(--bg)
        }

        .stat .c {
            position: relative;
            overflow: hidden
        }

        .stat .c:before {
            content: '';
            position: absolute;
            right: -16px;
            top: -16px;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: var(--s)
        }

        .btn {
            transition: .15s
        }

        .btn:active {
            transform: scale(.97)
        }

        .btn:not(.a):not(.x):not(.d) {
            background: linear-gradient(135deg, #315efb, #5b7cff);
            box-shadow: 0 3px 10px #315efb44
        }

        .c h2 {
            font-size: 17px
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid var(--b)
        }

        .pc {
            transition: .15s
        }

        .pc:hover {
            transform: translateY(-3px)
        }

        #md {
            border-radius: 20px;
            box-shadow: 0 20px 60px #0006
        }

        .qrb {
            display: inline-block;
            background: #fff;
            padding: 4px;
            border-radius: 8px;
            line-height: 0
        }

        #fab {
            position: fixed;
            right: 16px;
            bottom: calc(88px + env(safe-area-inset-bottom, 0px));
            width: 56px;
            height: 56px;
            border-radius: 50%;
            font-size: 24px;
            padding: 0;
            box-shadow: 0 6px 18px #0005;
            z-index: 6
        }

        @media print {

            header,
            nav,
            main,
            .np {
                display: none !important
            }

            #bg {
                position: static;
                background: none;
                padding: 0;
                display: block
            }

            #md {
                padding: 0;
                max-width: none
            }
        }
    </style>
</head>

<body>
    <header>
        <h1 id="ttl">🔧 Quản lý sửa chữa</h1><select id="role" style="width:auto" onchange="setRole(this.value)">
            <option value="staff">Nhân viên</option>
            <option value="manager">Quản lý</option>
            <option value="admin">Quản trị</option>
        </select><button class="btn x" onclick="tg()">◐</button>
    </header>
    <nav id="nav"></nav>
    <main id="app"></main>
    <div id="bg" onclick="if(event.target.id=='bg')cl()">
        <div id="md"></div>
    </div><datalist id="cl"></datalist>
    <div id="toast"></div><button class="btn np" id="fab" onclick="scan()" title="Quét mã">📷</button>
    <script>
        const $ = s => document.querySelector(s), e = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])), M = n => (+n || 0).toLocaleString('vi-VN') + 'đ', D0 = { t: [], p: [], log: [], tech: ['Kỹ thuật 1', 'Kỹ thuật 2'], role: 'admin', shop: { n: 'Cửa hàng sửa chữa', ph: '', ad: '' }, seq: 0, ex: [], im: [], od: [], cu: [], sq: 0, sv: [{ n: 'Công kiểm tra', pr: 50000 }, { n: 'Vệ sinh máy', pr: 100000 }, { n: 'Cài lại phần mềm', pr: 100000 }, { n: 'Thay pin', pr: 150000 }, { n: 'Thay màn hình', pr: 500000 }] };
        let D; try { D = JSON.parse(localStorage.getItem('rp1')) || D0 } catch { D = D0 } D = { ...D0, ...D };
        const ST = ['Tiếp nhận', 'Báo giá', 'Đang sửa', 'Hoàn thành', 'Đã giao'], RL = { staff: 1, manager: 2, admin: 3 }; let tab = 't', q = '', fs = '';
        function sv() { try { localStorage.setItem('rp1', JSON.stringify(D)) } catch { toast('Bộ nhớ đầy – hãy sao lưu và xóa bớt ảnh') } }
        function toast(s) { const t = $('#toast'); t.textContent = s; t.className = 'on'; setTimeout(() => t.className = '', 2200) }
        function log(s) { D.log.unshift({ d: new Date().toISOString(), r: D.role, s }); D.log = D.log.slice(0, 300) }
        function can(n) { return RL[D.role] >= n }
        function tg() { const r = document.documentElement, d = r.dataset.theme === 'dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme:dark)').matches); r.dataset.theme = d ? 'light' : 'dark' }
        const sum = t => t.parts.reduce((s, x) => s + x.q * x.pr, 0) + (+t.labor || 0) - (+t.dc || 0), debt = t => Math.max(0, sum(t) - t.paid), fd = d => d ? new Date(d).toLocaleDateString('vi-VN') : '—';
        const wEnd = t => { if (!t.done || !t.wm) return null; const d = new Date(t.done); d.setMonth(d.getMonth() + +t.wm); return d }, wOn = t => { const w = wEnd(t); return w && w >= new Date() }, late = t => t.status !== 'Đã giao' && t.due && new Date(t.due) < new Date(new Date().toDateString());
        function R() { $('#cl').innerHTML = allC().map(c => `<option value="${e(c.phone)}">${e(c.name)}</option>`).join(''); $('#ttl').textContent = '🔧 ' + (D.shop.n || 'Quản lý sửa chữa'); $('#role').value = D.role; $('#nav').innerHTML = [['t', '📋', 'Phiếu'], ['f', '🔍', 'Tra cứu'], ['n', '➕', 'Nhận máy'], ['b', '🛍', 'Bán hàng'], ['p', '📦', 'Kho'], ['k', '👥', 'Khách'], ['r', '📊', 'Báo cáo'], ['s', '⚙', 'Cài đặt']].map(([k, i, l]) => `<button class="${tab == k ? 'on' : ''}" onclick="tab='${k}';scrollTo(0,0);R()"><span>${i}</span>${l}</button>`).join(''); $('#app').innerHTML = { t: list, f: look, n: () => form(), b: sale, p: parts, k: cus2, r: stats, s: sett }[tab]() }
        function pill(t) { return `${t.pr == 'Gấp' ? '<span class="pill r">GẤP</span> ' : ''}<span class="pill ${t.status == 'Đã giao' ? 'k' : late(t) ? 'r' : ''}">${t.status}</span>` }
        function list() {
            const f = D.t.filter(t => (!fs || t.status == fs) && (t.code + t.name + t.phone + t.imei + t.model).toLowerCase().includes(q.toLowerCase())); const od = D.t.filter(late).length, lw = D.p.filter(p => p.s <= p.min).length, ap = D.t.filter(t => t.due && t.status != 'Đã giao' && t.due == new Date().toISOString().slice(0, 10)).length;
            return `<div class="stat"><div class="c"><b>${D.t.filter(t => t.status != 'Đã giao').length}</b><span class="mut">Đang xử lý</span></div><div class="c"><b style="color:var(--r)">${od}</b><span class="mut">Quá hạn</span></div><div class="c"><b>${ap}</b><span class="mut">Hẹn hôm nay</span></div><div class="c"><b>${D.t.reduce((s, t) => s + debt(t), 0) ? M(D.t.reduce((s, t) => s + debt(t), 0)) : '0'}</b><span class="mut">Công nợ</span></div></div>${lw ? `<div class="c"><span class="pill w">⚠ ${lw} linh kiện sắp hết</span></div>` : ''}
<div class="row" style="margin-bottom:10px"><button class="btn" onclick="tab='n';R()">➕ Nhận máy</button><button class="btn a" onclick="scan()">📷 Quét mã</button><button class="btn a" onclick="scan(deliver)">📦 Quét giao máy</button><button class="btn a" onclick="fs='Hoàn thành';R()">✅ Chờ giao</button><button class="btn x" onclick="fs='';q='';R()">Tất cả</button></div><div class="row"><input placeholder="Tìm mã phiếu, tên, SĐT, IMEI, model…" value="${e(q)}" oninput="q=this.value;lst()"><select onchange="fs=this.value;lst()"><option value="">Mọi trạng thái</option>${ST.map(s => `<option ${fs == s ? 'selected' : ''}>${s}</option>`)}</select></div><div id="lst" style="margin-top:10px">${rows(f)}</div>`
        }
        function lst() { $('#lst').innerHTML = rows(D.t.filter(t => (!fs || t.status == fs) && (t.code + t.name + t.phone + t.imei + t.model).toLowerCase().includes(q.toLowerCase()))) }
        function rows(a) { return a.slice().sort((x, y) => (x.status == 'Đã giao') - (y.status == 'Đã giao') || (y.pr == 'Gấp') - (x.pr == 'Gấp') || (x.due || '9').localeCompare(y.due || '9')).map(t => `<div class="c tk" style="border-left-color:${late(t) ? 'var(--r)' : { 'Tiếp nhận': '#8a94a8', 'Báo giá': '#b77819', 'Đang sửa': '#315efb', 'Hoàn thành': '#16865e', 'Đã giao': '#b4bdd0' }[t.status]}" onclick="view('${t.id}')"><div class="row" style="justify-content:space-between"><b>${t.code} · ${e(t.name)}</b>${pill(t)}</div><div class="mut">${e(t.type)} ${e(t.model)} · ${e(t.phone)} · KT: ${e(t.tech || 'chưa phân công')}</div><div class="steps">${ST.map((s, i) => `<i class="${i <= ST.indexOf(t.status) ? 'on' : ''}"></i>`).join('')}</div><div class="mut">${t.loc ? '📍' + e(t.loc) + ' · ' : ''}Hẹn: ${fd(t.due)}${late(t) ? ' · <b style="color:var(--r)">QUÁ HẠN</b>' : ''} · ${M(sum(t))}${debt(t) ? ' · nợ ' + M(debt(t)) : ''}${wOn(t) ? ' · <span class="pill k">BH đến ' + fd(wEnd(t)) + '</span>' : ''}</div></div>`).join('') || '<p class="mut">Chưa có phiếu.</p>' }
        let tmp = {};
